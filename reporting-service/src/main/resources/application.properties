spring.application.name=reporting-service
server.address=0.0.0.0
server.port=0
server.servlet.context-path=/hr/reporting

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
server.tomcat.allow-relative-redirects=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher

spring.jpa.show.sql=true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

logging.level.org.springframework.mail=DEBUG
logging.level.org.springframework.mail.javamail=DEBUG
#Logging
logging.file.name=/usr/local/hrms/microservices/logs/reporting-service.log
logging.level.root=INFO
logging.level.com.smartcare.hrms.payroll=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n