spring.application.name=attendance-service
server.address=0.0.0.0
server.port=0
server.servlet.context-path=/hr/attendance

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
server.tomcat.allow-relative-redirects=true
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
#Logging
logging.file.name=/usr/local/hrms/microservices/logs/attendance-service.log
logging.level.root=INFO
logging.level.com.smartcare.hrms.employee=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n