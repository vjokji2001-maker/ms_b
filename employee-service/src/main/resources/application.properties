spring.application.name=employee-service
server.address=0.0.0.0
server.port=0
server.servlet.context-path=/hr/employee

#Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

spring.mvc.pathmatch.matching-strategy=ant-path-matcher
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql = true
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.use-new-id-generator-mappings=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# File upload configuration
file.upload.dir=/staging_employee_uploads
spring.web.resources.static-locations=file:/staging_employee_uploads/
server.base.url=http://103.177.84.241:9099/hr/employee/

#Logging
logging.file.name=/usr/local/hrms/microservices/logs/employee-service.log
logging.level.root=INFO
logging.level.com.smartcare.hrms.employee=DEBUG
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n