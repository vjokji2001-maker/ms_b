spring.application.name=gateway-service
server.port=9099
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

#Gateway Cors filter setting
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.corsConfigurations.[/**].allowedHeaders=*

## Master Service Route
spring.cloud.gateway.routes[0].id=master-service
spring.cloud.gateway.routes[0].uri=lb://master-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/hr/master/**

## Employee Service Route
spring.cloud.gateway.routes[1].id=employee-service
spring.cloud.gateway.routes[1].uri=lb://employee-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/hr/employee/**

## Attendance Service Route
spring.cloud.gateway.routes[2].id=attendance-service
spring.cloud.gateway.routes[2].uri=lb://attendance-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/hr/attendance/**



## Discovery Server Route
spring.cloud.gateway.routes[3].id=discovery-server
spring.cloud.gateway.routes[3].uri=http://localhost:8761
spring.cloud.gateway.routes[3].predicates[0]=Path=/eureka/web
spring.cloud.gateway.routes[3].filters[0]=SetPath=/

## Discovery Server Static Resources Route
spring.cloud.gateway.routes[4].id=discovery-server-static
spring.cloud.gateway.routes[4].uri=http://localhost:8761
spring.cloud.gateway.routes[4].predicates[0]=Path=/eureka/**

## Payroll Service Route
spring.cloud.gateway.routes[5].id=payroll-service
spring.cloud.gateway.routes[5].uri=lb://payroll-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/hr/payroll/**

## Migration Service Route
spring.cloud.gateway.routes[6].id=migration-service
spring.cloud.gateway.routes[6].uri=lb://migration-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/hr/migration/**

## Reporting Service Route
spring.cloud.gateway.routes[7].id=reporting-service
spring.cloud.gateway.routes[7].uri=lb://reporting-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/hr/reporting/**

## Hiring Service Route
spring.cloud.gateway.routes[8].id=hiring-service
spring.cloud.gateway.routes[8].uri=lb://hiring-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/hr/hiring/**

## Staff / Mobile App Service Route
spring.cloud.gateway.routes[9].id=staff-service
spring.cloud.gateway.routes[9].uri=lb://staff-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/hr/staff/**

#Logging
logging.file.name=/usr/local/hrms/microservices/logs/gateway-service.log
logging.level.root=INFO
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
